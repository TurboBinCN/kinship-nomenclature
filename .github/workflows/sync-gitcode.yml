name: Sync to GitCode

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitCode
        run: |
          git remote add gitcode "https://${{ secrets.GITCODE_USERNAME }}:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ secrets.GITCODE_USERNAME }}/kinship-nomenclature.git"
          git push gitcode main --force
          git push gitcode --tags --force
